<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TL-SwitchOS</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<div id="login" class="login hidden">
  <form id="loginForm" class="login-box">
    <img src="/logo.svg" alt="" class="login-logo">
    <h1>TL-SwitchOS</h1>
    <p class="muted" id="loginHost">Connexion à l'administration du switch</p>
    <label>Utilisateur<input id="lu" autocomplete="username" required></label>
    <label>Mot de passe<input id="lp" type="password" autocomplete="current-password" required></label>
    <button class="btn primary block" type="submit">Connexion</button>
    <p id="loginErr" class="err"></p>
    <p class="login-foot">TECH-LINUX</p>
  </form>
</div>

<div id="pwc" class="login hidden">
  <form id="pwcForm" class="login-box">
    <img src="/logo.svg" alt="" class="login-logo">
    <h1>Nouveau mot de passe</h1>
    <p class="muted">Ton mot de passe est provisoire. Choisis ton mot de passe définitif : il servira en console, en SSH et ici.</p>
    <label>Nouveau mot de passe<input id="pn1" type="password" autocomplete="new-password" minlength="8" required></label>
    <label>Confirmation<input id="pn2" type="password" autocomplete="new-password" minlength="8" required></label>
    <button class="btn primary block" type="submit">Enregistrer</button>
    <p id="pwcErr" class="err"></p>
  </form>
</div>

<div id="app" class="hidden">
  <aside class="side" id="side">
    <div class="brand"><img src="/logo.svg" alt=""><div><b id="hn">switch</b><span id="ver"></span></div></div>
    <nav id="nav"></nav>
    <div class="side-foot"><span id="who"></span><button id="logout" class="btn ghost small">Déconnexion</button></div>
  </aside>
  <div class="shell">
    <header class="top">
      <button id="burger" class="icon-btn" aria-label="Menu"></button>
      <h1 id="title">Tableau de bord</h1>
      <div class="top-right">
        <span id="rb" class="pill warn hidden"></span>
        <span id="unsaved" class="pill warn hidden">Modifications non enregistrées</span>
        <button id="saveBtn" class="btn primary small">Enregistrer</button>
        <button id="themeBtn" class="icon-btn" aria-label="Thème clair ou sombre" title="Thème clair / sombre"></button>
      </div>
    </header>
    <main id="main"></main>
  </div>
  <aside id="cmdlog" class="cmdlog min"><div class="cmdlog-h">CLI <span class="muted">commandes envoyées</span></div><pre id="cmdlogPre"></pre></aside>
</div>
<div id="modal" class="drawer-bg hidden"><div class="drawer" id="modalBox"></div></div>
<div id="toast" class="toast hidden"></div>
</body>
</html>
